<style>
  .reserva-wrap {
    max-width: 560px;
    margin: 40px auto;
    padding: 24px;
    border-radius: 18px;
    background: #f6f7fb;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    font-family: Arial, sans-serif;
  }
  .reserva-wrap h1 {
    margin-bottom: 20px;
    text-align: center;
    color: #1f2937;
  }
  .reserva-form {
    display: grid;
    gap: 14px;
  }
  .reserva-form p {
    margin: 0;
    display: grid;
    gap: 6px;
  }
  .reserva-form label {
    font-weight: 600;
    color: #374151;
  }
  .reserva-form input,
  .reserva-form textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 15px;
    box-sizing: border-box;
  }
  .reserva-form button {
    margin-top: 8px;
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-weight: 700;
    cursor: pointer;
  }
  .aviso {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    background: #dcfce7;
    color: #166534;
  }
</style>

<div class="reserva-wrap">
  <h1>Reserva tu mesa</h1>
  <form class="reserva-form" method="post" action="{% url 'ventas' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Reservar</button>

    {% if messages %}
      {% for m in messages %}
        <p class="aviso">{{ m }}</p>
      {% endfor %}
    {% endif %}
  </form>
</div>
