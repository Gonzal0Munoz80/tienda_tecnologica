{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 | Página no encontrada</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 20px;
            display: grid;
            place-items: center;
            background: #f5f7fb;
            color: #172033;
            font-family: "Segoe UI", Arial, sans-serif;
            text-align: center;
        }

        main {
            width: min(100%, 1000px);
        }

        .error-code {
            margin: 0;
            color: #5b5bd6;
            font-size: clamp(4rem, 12vw, 7rem);
            font-weight: 800;
            letter-spacing: -0.08em;
            line-height: 1;
        }

        h1 {
            margin: 12px 0 8px;
            font-size: clamp(1.5rem, 4vw, 2.3rem);
            letter-spacing: -0.04em;
        }

        .message {
            margin: 0 0 24px;
            color: #64748b;
            font-size: 1.05rem;
        }

        img {
            display: block;
            width: 100%;
            max-height: 65vh;
            margin: 0 auto 24px;
            border-radius: 18px;
            object-fit: cover;
            box-shadow: 0 18px 50px rgba(27, 37, 71, 0.16);
        }

        a {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 9px;
            background: #5b5bd6;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            background: #4545b5;
        }

        a:focus-visible {
            outline: 3px solid #9b9bf2;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main>
        <p class="error-code">404</p>
        <h1>¡Ups! Nos perdimos entre tantos gatos.</h1>
        <p class="message">La página que buscas no existe o fue movida.</p>
        <img src="{% static 'droolingcatscover.jpg' %}" alt="Un grupo de gatos mirando sorprendidos">
        <a href="{% url 'inicio' %}">Volver al inicio</a>
    </main>
</body>
</html>
